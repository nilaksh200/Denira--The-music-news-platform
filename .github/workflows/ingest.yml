name: Hourly Inshorts Cloud Ingest

on:
  schedule:
    # Runs automatically every hour (at minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
    # Allows manual trigger via GitHub Actions UI for testing / on-demand cycles
    inputs:
      limit:
        description: 'Maximum stories to summarize and persist'
        required: false
        default: '10'
      dry_run:
        description: 'Run pipeline in dry-run mode (do not commit to DB)'
        type: boolean
        required: false
        default: false

concurrency:
  group: denira-ingestion-cron
  cancel-in-progress: false

jobs:
  ingest-and-summarize:
    name: Run Ingestion & Editorial Synthesis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Autonomous Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: '1'
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            python backend/pipeline.py --limit ${{ inputs.limit }} $EXTRA_FLAGS
          else
            python backend/pipeline.py --limit 10 $EXTRA_FLAGS
          fi
