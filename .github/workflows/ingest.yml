name: Hourly Inshorts Cloud Ingest

on:
  schedule:
    # Runs automatically every hour (minute 0)
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Batch limit (default 10)'
        required: false
        default: '10'
      dry_run:
        description: 'Run without writing to database'
        required: false
        default: 'false'

concurrency:
  group: denira-ingest-pipeline
  cancel-in-progress: false

jobs:
  ingest:
    name: Harvest, Summarize & Persist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Execute Autonomous Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: '1'
        run: |
          EXTRA_FLAGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --dry-run"
          fi
          if [ -n "${{ inputs.limit }}" ]; then
            python backend/pipeline.py --limit ${{ inputs.limit }} $EXTRA_FLAGS
          else
            python backend/pipeline.py --limit 10 $EXTRA_FLAGS
          fi